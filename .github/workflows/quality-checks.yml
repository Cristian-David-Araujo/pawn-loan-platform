name: Quality Checks

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
      - develop

jobs:
  api-server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api-server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pawn_loan_test
          POSTGRES_USER: pawn_user
          POSTGRES_PASSWORD: pawn_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api-server/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        env:
          # Production runs on PostgreSQL, so the suite must too.
          TEST_DATABASE_URL: postgresql+psycopg://pawn_user:pawn_password@localhost:5432/pawn_loan_test
          DATABASE_URL: postgresql+psycopg://pawn_user:pawn_password@localhost:5432/pawn_loan_test
          JWT_SECRET_KEY: ci_secret_key_for_tests_only_min_32_chars
        run: pytest -q

  web-client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `t()` renders a missing key as the key itself, so an unmapped string reaches the
      # operator as raw text like `common.loading` and nothing anywhere fails. Six such keys
      # had already shipped, one of them onto a printed customer document. Typecheck cannot
      # see them: the key is just a string.
      - name: Translation keys
        run: npm run check:i18n

      # Two themes double the surface area for a contrast regression, and eyeballing does
      # not catch it: --placeholder shipped at 3.4:1 behind a comment claiming 4.6:1.
      - name: Colour contrast
        run: npm run check:contrast

      # Contrast measures token *pairs* — the palette's intent — so it cannot see a rule that
      # references a token which does not exist. `var(--undefined)` with no fallback makes the
      # declaration invalid and `color` then inherits, which on the dark theme looks correct
      # and on the light theme paints dark ink on a saturated fill. That shipped twice.
      - name: Design tokens exist
        run: npm run check:tokens

      # Mounts every view. vue-tsc cannot see these failures: an invalid template makes it
      # stop counting template usage, so a broken view is reported as *unused variables* —
      # its verdict inverts exactly when something is badly broken. Three views shipped a
      # blank page in one sitting before this existed, each found by driving a browser.
      - name: Views render
        run: npm test

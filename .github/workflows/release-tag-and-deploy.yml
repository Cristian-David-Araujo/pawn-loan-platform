name: Release Tag And Deploy

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  packages: write   # Required to push images to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: cristian-david-araujo/pawn-loan-platform

jobs:
  release-and-deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Calculate release version from GitFlow branch
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          chmod +x .github/scripts/calculate_version.sh
          ./.github/scripts/calculate_version.sh "$HEAD_REF"

      - name: Show release info
        run: |
          echo "Latest tag: ${{ steps.version.outputs.latest_tag }}"
          echo "Next version: ${{ steps.version.outputs.version }}"
          echo "Next tag: ${{ steps.version.outputs.tag }}"
          echo "Bump kind: ${{ steps.version.outputs.bump_kind }}"

      - name: Check if release tag already exists
        id: tag_check
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_SHA" != "$MERGE_SHA" ]]; then
              echo "Tag $TAG already exists but points to $TAG_SHA (expected $MERGE_SHA)." >&2
              exit 1
            fi

            echo "Tag $TAG already exists on expected merge commit."
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag_exists=false" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag on merge commit
        if: steps.tag_check.outputs.tag_exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [[ -z "$MERGE_SHA" ]]; then
            echo "Could not resolve merge commit SHA from pull_request event." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" "$MERGE_SHA" -m "Release $VERSION"
          git push origin "$TAG"

      # ─── Docker build & push to GHCR ─────────────────────────────────────────

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Type-check web-client (separate from image build)
        working-directory: apps/web-client
        run: |
          npm ci
          npm run typecheck

      # Vite inlines this into the bundle, so it is a *build* input and cannot be changed on the
      # droplet afterwards. It is read from the versioned production config rather than from a
      # secret because it is not one, and because the value the image was built with should be
      # visible in the same diff as the deploy that shipped it.
      - name: Read VITE_API_BASE_URL from versioned production config
        id: prod_config
        run: |
          set -euo pipefail
          VALUE="$(sed -n 's/^VITE_API_BASE_URL=//p' deploy/digitalocean/production.env | tail -n 1)"
          test -n "$VALUE" || (echo "VITE_API_BASE_URL missing from deploy/digitalocean/production.env" >&2 && exit 1)
          echo "vite_api_base_url=$VALUE" >> "$GITHUB_OUTPUT"
          echo "Building web-client against API base URL: $VALUE"

      - name: Build and push web-client image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web-client
          file: ./apps/web-client/Dockerfile.prod
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ steps.prod_config.outputs.vite_api_base_url }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/web-client:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/web-client:latest
          # Separate scope per image: a shared scope makes each build overwrite the other's
          # cache. ignore-error keeps a full or unavailable cache from failing the release,
          # since the image itself is already pushed by the time the cache is exported.
          cache-from: type=gha,scope=web-client
          cache-to: type=gha,mode=max,scope=web-client,ignore-error=true

      - name: Build and push api-server image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api-server
          file: ./apps/api-server/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/api-server:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/api-server:latest
          cache-from: type=gha,scope=api-server
          cache-to: type=gha,mode=max,scope=api-server,ignore-error=true

      # ─── SSH deploy: pull pre-built images on the droplet ────────────────────

      # The connection, the rendered environment and the compose commands live in the shared
      # action and in deploy/digitalocean/remote_deploy.sh, which the manual deploy workflow
      # runs too — a release and a rollback must not be able to do different things.
      - name: Deploy to DigitalOcean droplet
        uses: ./.github/actions/deploy-to-droplet
        with:
          host: ${{ secrets.DO_HOST }}
          user: ${{ secrets.DO_USER }}
          ssh_key_b64: ${{ secrets.DO_SSH_KEY_B64 }}
          ssh_key: ${{ secrets.DO_SSH_KEY }}
          image_tag: ${{ steps.version.outputs.tag }}
          ghcr_user: ${{ github.actor }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}
          postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
          jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
          admin_password: ${{ secrets.ADMIN_PASSWORD }}

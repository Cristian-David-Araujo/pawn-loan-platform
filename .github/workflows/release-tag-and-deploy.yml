name: Release Tag And Deploy

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  packages: write   # Required to push images to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: cristian-david-araujo/pawn-loan-platform

jobs:
  release-and-deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Calculate release version from GitFlow branch
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          chmod +x .github/scripts/calculate_version.sh
          ./.github/scripts/calculate_version.sh "$HEAD_REF"

      - name: Show release info
        run: |
          echo "Latest tag: ${{ steps.version.outputs.latest_tag }}"
          echo "Next version: ${{ steps.version.outputs.version }}"
          echo "Next tag: ${{ steps.version.outputs.tag }}"
          echo "Bump kind: ${{ steps.version.outputs.bump_kind }}"

      - name: Check if release tag already exists
        id: tag_check
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_SHA" != "$MERGE_SHA" ]]; then
              echo "Tag $TAG already exists but points to $TAG_SHA (expected $MERGE_SHA)." >&2
              exit 1
            fi

            echo "Tag $TAG already exists on expected merge commit."
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag_exists=false" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag on merge commit
        if: steps.tag_check.outputs.tag_exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [[ -z "$MERGE_SHA" ]]; then
            echo "Could not resolve merge commit SHA from pull_request event." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" "$MERGE_SHA" -m "Release $VERSION"
          git push origin "$TAG"

      # ─── Docker build & push to GHCR ─────────────────────────────────────────

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Type-check web-client (separate from image build)
        working-directory: apps/web-client
        run: |
          npm ci
          npm run typecheck

      - name: Build and push web-client image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web-client
          file: ./apps/web-client/Dockerfile.prod
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/web-client:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/web-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push api-server image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api-server
          file: ./apps/api-server/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/api-server:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/api-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── SSH deploy: pull pre-built images on the droplet ────────────────────

      - name: Validate deployment secrets
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          test -n "$DO_HOST" || (echo "Missing secret: DO_HOST" && exit 1)
          test -n "$DO_USER" || (echo "Missing secret: DO_USER" && exit 1)
          if [[ -z "$DO_SSH_KEY_B64" && -z "$DO_SSH_KEY" ]]; then
            echo "Missing SSH key secret: set DO_SSH_KEY_B64 (preferred) or DO_SSH_KEY." >&2
            exit 1
          fi

      - name: Prepare SSH key file
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -euo pipefail

          if [[ -n "$DO_SSH_KEY_B64" ]]; then
            printf '%s' "$DO_SSH_KEY_B64" | base64 -d > /tmp/do_key
          else
            # Fallback for plain multi-line secret.
            printf '%s\n' "$DO_SSH_KEY" > /tmp/do_key
          fi

          chmod 600 /tmp/do_key

          # Fails early for malformed key, wrong key type, or passphrase-protected key.
          ssh-keygen -y -f /tmp/do_key >/dev/null

      - name: Deploy — pull pre-built images on DigitalOcean droplet
        uses: appleboy/ssh-action@v1.2.2
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key_path: /tmp/do_key
          script_stop: true
          envs: RELEASE_TAG,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail

            APP_DIR="${DO_APP_DIR:-/opt/pawn-loan-platform}"
            cd "$APP_DIR"

            # Pull latest code (only config files, compose, etc. — no source build needed)
            git fetch --all --tags --prune
            git checkout main
            git pull origin main

            # Login to GHCR so the droplet can pull private images
            # (No-op if the repo/packages are public, but safe to always run)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pull the pre-built images (fast: just downloading layers)
            IMAGE_TAG="$RELEASE_TAG" docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              pull

            # Restart services with the new images (zero downtime: existing containers
            # keep running until the new ones are healthy)
            IMAGE_TAG="$RELEASE_TAG" docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              up -d --remove-orphans

            # Clean up dangling images to reclaim disk space
            docker image prune -f

            echo "Deployment completed from tag ${RELEASE_TAG}"

      - name: Cleanup SSH key file
        if: always()
        run: rm -f /tmp/do_key

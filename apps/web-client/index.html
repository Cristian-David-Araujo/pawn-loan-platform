<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Loan, collateral and payment management for a pawn and consumer lender." />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#1a1815" />
    <title>Pawn Loan Platform</title>
    <!--
      Loaded here rather than through an @import in main.css: an @import is only
      discovered after the stylesheet itself has been fetched and parsed, which
      serialises the two requests and shows the app in a fallback face first.
      Manrope carries the interface; JetBrains Mono carries figures and codes,
      where proportional digits would make a column of pesos jitter row to row.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location ~ /\. {
    deny all;
    return 404;
  }

  # Block common scanner targets so they never hit SPA fallback.
  location ~* ^/(wp-admin|wp-content|wp-includes|phpmyadmin|\.git|\.svn|\.hg|\.env) {
    return 404;
  }

  # Vite fingerprints everything under /assets/, so the name changes whenever the bytes do and
  # a stale copy can never be served for new content. Caching it for a year is what makes the
  # revalidation on index.html below cost almost nothing. `^~` wins over the regex location
  # that follows, regardless of order.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # The one file that must never be served from cache without asking. It is the only thing that
  # knows which fingerprinted bundle is current, so a cached copy pins the browser to the
  # previous release: after a deploy that changed the API base URL, the old bundle kept calling
  # a hostname that no longer resolved, and the login screen reported the failure as invalid
  # credentials. `no-cache` still allows storing it — the ETag turns the check into a 304.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # For file-like requests, serve only if the file exists.
  # Missing files should be 404 instead of index.html.
  location ~* "\.[a-z0-9][a-z0-9]*$" {
    try_files $uri =404;
  }

  # SPA fallback. The internal redirect re-enters location matching, so a deep link is served
  # by the block above with the same no-cache header.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
